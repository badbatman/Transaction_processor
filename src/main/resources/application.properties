# Application Configuration
app.name=Transaction Processor
app.version=1.0.0

# Dry run mode: when true, the processor will read live data but will not perform any writes/updates/formatting.
# A JSON preview will be written under target/ for operator review.
app.dry.run=false

# Google Sheets Configuration
google.sheets.application.name=Transaction Processor
google.sheets.credentials.path=credentials.json
google.sheets.api.version=v4
google.sheets.retry.max.attempts=3
google.sheets.retry.delay.ms=1000

# CSV Processing Configuration
csv.encoding=UTF-8
csv.date.formats=yyyy/M/d,yyyy-MM-dd,yyyy/MM/dd,yyyy-M-d
csv.number.formats=#,##0.00

# Processing Configuration
processing.batch.size=100
processing.retry.max.attempts=3
processing.retry.delay.ms=2000

# Logging Configuration
logging.level.root=INFO
logging.level.com.transactionprocessor=DEBUG
logging.file.name=logs/transaction-processor.log
logging.file.max-size=10MB
logging.file.max-history=30

# Performance Configuration
performance.monitoring.enabled=true
performance.metrics.enabled=true
performance.reporting.interval=60000
